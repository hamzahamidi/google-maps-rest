name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every leg. With the default fail-fast, one leg failing cancels the
      # others mid-step, which hides whether the remaining versions are healthy.
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      # The dual ESM and CJS surface is not exercised by the unit tests: they import
      # source, not the built package. publint and attw resolve the packed tarball the
      # way a consumer would, which is the only place a broken exports map shows up.
      - run: npm run check:package
      - name: Analyze with SonarQube Cloud
        if: matrix.node == 22 && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
