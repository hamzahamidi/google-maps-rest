name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Three jobs rather than one, because they need different gating. The dry run stays
# ungated or every pull request would wait on a human to learn whether its
# configuration parses. The plan is ungated and decides, with the same commit
# analysis the publish uses, whether a push to main releases anything at all, so a
# chore or docs merge never parks a run at the gate. The publish is gated, because
# a push to main publishes to npm irreversibly: unpublishing is limited to 72 hours
# and only while nothing depends on the version.
jobs:
  dry-run:
    name: Dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # semantic-release's own isPr guard returns before verifyConditions, so on a
      # pull request it exits before it reaches npm authentication. This catches
      # configuration and plugin errors only. It does not prove OIDC publishing works.
      - run: npx semantic-release --dry-run

  plan:
    name: Plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # semantic-release verifies push access with a git dry-run push even in dry-run
      # mode, so the token is needed here although nothing is pushed.
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.mjs

  release:
    name: Release
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    # This name must exist as an environment with required reviewers under
    # Settings, Environments. GitHub creates an unprotected environment on first
    # use if it does not, which gates nothing at all.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10, and Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
